<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GDCR 2026 Vienna</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/simple.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.css">
  <style>
    .tetris-steps { display: flex; justify-content: center; gap: 30px; }
    .tetris-step h3 { font-size: 0.6em; margin-bottom: 0.5em; }
    .tetris-board { display: grid; grid-template-columns: repeat(8, 22px); gap: 2px; padding: 4px; box-shadow: inset 0 0 0 1px rgb(159,159,159); }
    .tetris-board.tetris-over { box-shadow: inset 0 0 0 2px rgb(255,107,182); }
    .tetris-board i { width: 22px; height: 22px; background: rgb(227,227,227); }
    .tetris-board i.a { background: #1EAEE9; }
    .tetris-board i.s { background: rgb(118,118,118); }
    .tetris-board i.t { background: rgba(30,174,233,0.25); }
    .tetris-board i.g { box-shadow: inset 0 0 0 2px #1EAEE9; }
    .tetris-board i.c { background: rgb(29,201,158); }
    .tdd-cycle { width: 720px; height: auto; }
    .reveal figure.slide-img { margin: 0; display: flex; flex-direction: column; align-items: center; }
    .reveal figure.slide-img img { max-height: 470px; max-width: 100%; width: auto; margin: 0; }
    .reveal .img-credit { font-size: 0.3em; color: #888; margin-top: 0.4em; }
    .reveal .img-credit a { color: #888; text-decoration: underline; }
    .reveal figure.slide-img img.full-width { width: 100%; max-height: 560px; }
    .reveal .thesis { font-size: 1.3em; margin: 0.3em 0; }
    .reveal .thesis.bridge { margin-top: 1.6em; }
    .reveal .punchline { margin-top: 1.2em; font-size: 1.6em; font-weight: bold; color: #1EAEE9; }
    .reveal .side-by-side { display: flex; align-items: center; justify-content: center; gap: 1.5em; }
    .reveal .side-by-side ul { flex: 1 1 55%; margin: 0; }
    .reveal .side-by-side figure.slide-img { flex: 0 1 40%; }
    .reveal .side-by-side figure.slide-img img { max-height: 440px; }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section>
        <section data-markdown="00_intro.md"></section>
        <section data-markdown="00a_why-care-about-code.md"></section>
        <section data-markdown="00b_intro-closing.md"></section>
      </section>
      <section><section data-markdown="01_session1.md"></section></section>
      <section><section data-markdown="02_session2.md"></section></section>
      <section><section data-markdown="03_session3.md"></section></section>
      <section><section data-markdown="04_session4.md"></section></section>
      <section><section data-markdown="05_session5.md"></section></section>
      <section><section data-markdown="06_closing.md"></section></section>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script>Reveal.initialize({ plugins: [RevealMarkdown, RevealHighlight] });</script>
</body>
</html>
